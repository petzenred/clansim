[project]
name = "clansim"
version = "0.1.0"
description = "Fan edit of the warrior cat game ClanGen(erator)"
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [
    { name = "Red Petzen", email = "<noemail@null.com>" },
]
maintainers = [
    { name = "Red Petzen", email = "<noemail@null.com>" },
]
keywords = [ "warriorcats", "fanedit", "game", "pygame" ]

[project.urls]
homepage = "https://clangen.io"
repository = "https://github.com/petzenred/clansim"

[tool.poetry]

[tool.poetry.dependencies]
pygame-ce = "^2.2.1"
ujson = "^5.7.0"
pygame-gui = "0.6.12"
platformdirs = "^3.3.0"
pypresence = { version = "^4.2.1", optional = true }
pgpy = "^0.6.0"
requests = "^2.28.2"
strenum = "^0.4.10"
black = "24.3.0"

[tool.poetry.group.test]
optional = true
[tool.poetry.group.test.dependencies]
pylint = "^2.17.3"
jsonschema = "^4.23.0"

[tool.poetry.group.build]
optional = true
[tool.poetry.group.build.dependencies]
pyinstaller = "^6.6.0"
pillow = "^9.5.0"
setuptools = "^67.7.2"
wheel = "^0.40.0"

[tool.poetry.group.docs]
optional = true
[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5.49"
mkdocs = ">=1.6.1"
mkdocs-git-committers-plugin-2 = ">=2.4.1"
mkdocs-git-revision-date-localized-plugin = ">=1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"

[tool.poetry.extras]
discord = ["pypresence"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
