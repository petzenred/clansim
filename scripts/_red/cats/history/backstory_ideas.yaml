  outsider_roots7: {CAT/main} was born into {CLAN/main}Clan, but one of {PRONOUN/main/poss} parents is a rogue who {PRONOUN/main/subject} {CONJU/main/have/has} never met.
  outsider_roots8: {CAT/main} was born into {CLAN/main}Clan, but one of {PRONOUN/main/poss} parents is a rogue who visits {PRONOUN/main/object} regularly at the border.
