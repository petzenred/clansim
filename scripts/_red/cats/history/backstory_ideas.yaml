backstories:
  clan_founder1: {CAT/main} was originally a kittypet, but was recruited to help found {CLAN/main}Clan.
  clan_founder2: {CAT/main} was originally a loner, but was recruited to help found {CLAN/main}Clan.
  clan_founder3: {CAT/main} was originally a rogue, but was recruited to help found {CLAN/main}Clan.
  clan_founder4: {CAT/main} belonged to the original {CLAN/main}Clan, but {PRONOUN/main/subject} lost {PRONOUN/main/poss} territory to a disaster. Now, {PRONOUN/main/subject} {CONJU/main/have/has} come to help rebuild.
  clan_founder5: {CAT/main} was originally a member of {CLAN/other}Clan, but decided to leave to help create a Clan of {PRONOUN/main/poss} own where {PRONOUN/main/subject} could have more influence.
  clan_founder6: {CAT/main} was exiled from {PRONOUN/main/poss} original Clan for breaking the warrior code, and decided to help found {CLAN/main}Clan for a shot at redemption.
  clan_founder7: {CAT/main} received a prophecy about founding a new Clan to bring balance to the territories, and joined {CLAN/main}Clan's efforts.
  clan_founder8: {CAT/main} left {CLAN/other}Clan due to religious differences, and decided to help found {CLAN/main}Clan in hopes it would align more with - or at least be tolerant of -  {PRONOUN/main/poss} practices.
  clan_founder9: {CAT/main} was originally reluctant to help found {CLAN/main}Clan, but decided to join after {CAT/second} convinced {PRONOUN/main/object}.
  clan_founder10: {CAT/main} followed {CAT/second} into {CLAN/main}Clan.
  clan_founder11: {CAT/main} was sent by the leader of {CLAN/other}Clan to gather secrets and intel on the newly formed {CLAN/main}Clan.
  clan_founder12: {CAT/main} was sent by the leader of a rogue group to gather secrets and intel on the newly formed {CLAN/main}Clan.
  clan_founder13: {CAT/main} belonged to the original {CLAN/main}Clan, whose territory was taken over by {CLAN/other}Clan. Lost with a Clan, {PRONOUN/main/subject} {CONJU/main/have/has} come to  rebuild {PRONOUN/main/poss} life.
  clan_founder14: {CAT/main} belonged to the original {CLAN/main}Clan, whose territory was lost in a war against rogues. Now, {PRONOUN/main/subject} {CONJU/main/have/has} come to rebuild.
  clan_founder15: {CAT/main} belonged to the original {CLAN/main}Clan, whose territory is now a Twolegplace. Now, {PRONOUN/main/subject} {CONJU/main/have/has} come to rebuild.
  clan_founder16: {CAT/main} received a prophecy that the creation of {CLAN/main}Clan would lead to the downfall of the territories, and came to stop it from happening.
  clan_founder17: {CAT/main} came to fulfill {PRONOUN/main/poss} destiny of helping to found {CLAN/main}Clan after receiving a prophecy from StarClan.
  clan_founder18: {CAT/main} was originally reluctant to help found {CLAN/main}Clan, but decided to join after {CAT/second} convinced {PRONOUN/main/object}.
  dead1: {CAT/main} died due to an illness outbreak.
  dead10: {CAT/main} died a noble death, protecting {PRONOUN/main/poss} loved ones from harm.
  dead11: {CAT/main} was killed in a war against another Clan.
  dead12: {CAT/main} was killed by Twolegs.
  dead13: {CAT/main} was struck down by StarClan for failing to fulfill a prophecy.
  dead14: {CAT/main} was struck down by StarClan for failing to heed an omen.
  dead15: {CAT/main} died peacefully in {PRONOUN/main/poss} sleep.
  dead2: {CAT/main} was murdered long ago by an assailant on whom {PRONOUN/main/subject} {CONJU/main/continue/continues} to swear {PRONOUN/main/poss} revenge.
  dead3: {CAT/main} died peacefully, surrounded by loved ones.
  dead4: A horrific tragedy befell {CAT/main}, which led to {PRONOUN/main/poss} demise. {PRONOUN/main/subject/CAP}'d prefer not to speak of it.
  dead5: {CAT/main} was injured during a fight and died due to complications from {PRONOUN/main/poss} injuries.
  dead6: {CAT/main} had a lifelong illness that eventually took {PRONOUN/main/poss} life.
  dead7: {CAT/main} was executed by the Clan leader due to {PRONOUN/main/poss} crimes.
  dead8: {CAT/main} can't remember how {PRONOUN/main/subject} died.
  dead9: {CAT/main} attempted to murder one of {PRONOUN/main/poss} clanmates, but was killed in the ensuing fight.
  guided5: {CAT/main} used to live outside the Clans, but came here after a deceased loved one told {PRONOUN/main/object} that {PRONOUN/main/subject} must follow {PRONOUN/main/poss} heart to find {PRONOUN/main/poss} true home.
  guided6: {CAT/main} is the descendant of a long-since disbanded Clan. Following the wishes of a ghostly cat with a pelt full of stars, {PRONOUN/main/subject} joined the Clan to continue the legacy.
  halfclan10: One of {CAT/main}'s parents is the deputy of another Clan, and {PRONOUN/main/subject} {CONJU/main/visit/visits} regularly.
  halfclan3: One of {CAT/main}'s parents is a mediator in another Clan, and {PRONOUN/main/subject} {CONJU/main/have/has} never met them.
  halfclan4: One of {CAT/main}'s parents is a mediator in another Clan, and {PRONOUN/main/subject} {CONJU/main/visit/visits} regularly.
  halfclan5: One of {CAT/main}'s parents is the leader of another Clan, but {PRONOUN/main/subject} {CONJU/main/have/has} never met them.
  halfclan6: One of {CAT/main}'s parents is the deputy of another Clan, but {PRONOUN/main/subject} {CONJU/main/have/has} never met them.
  halfclan7: One of {CAT/main}'s parents is the healer of another Clan, {PRONOUN/main/subject} {CONJU/main/have/has} never met them.
  halfclan8: One of {CAT/main}'s parents is the healer of another Clan, and {PRONOUN/main/subject} {CONJU/main/visit/visits} regularly.
  halfclan9: One of {CAT/main}'s parents is the leader of another Clan, and {PRONOUN/main/subject} {CONJU/main/visit/visits} regularly.
  kittypet10: {CAT/main} was a kittypet in the same house as their mate, but when their mate began to have visions of starry-furred cats and left for the Clan, {CAT/main} followed them.
  kittypet5: {CAT/main} was originally a kittypet, but left home with big dreams of becoming a legendary warrior!
  kittypet6: {CAT/main} was born as a kittypet, but abandonment led {PRONOUN/main/object} to joining the Clan.
  kittypet7: {CAT/main} always longed for a life beyond the fence. One day, {PRONOUN/main/subject} finally gathered {PRONOUN/main/poss} courage and joined the Clan, where {PRONOUN/main/subject} currently reside.
  kittypet8: {CAT/main} used to be a kittypet, but was forced to leave {PRONOUN/main/poss} housefolk after {PRONOUN/main/poss} home burned down.
  kittypet9: {CAT/main} was originally a kittypet, but left after {PRONOUN/main/poss} housefolk brought home a large dog.
  loner3: {CAT/main} didn't get to see {PRONOUN/main/poss} parent alive, and was found by a Clan patrol.
  loner4: {CAT/main} joined {CLAN/main}Clan after becoming weary of living alone.
  loner5: {CAT/main} wandered the world, aimless and free, but always alone.
  loner6: {CAT/main} wandered the world, aimless and free, but always alone - until {PRONOUN/main/subject} found someone worth staying for.
  loner7: {CAT/main} was joined by {CAT/travel_comp} on {PRONOUN/main/poss} travels across the lands, and after seeing everything life has to offer, decided to settle down in {CLAN/main}Clan.
  newdfguide1: {CAT/main} sensed darkness within the newly formed {CLAN/main}Clan and decided to become their new Dark Forest guide.
  newdfguide2: Betrayed by {PRONOUN/main/poss} Clan in life, {CAT/main} now lures cats to the Dark Forest, promising the revenge {PRONOUN/main/subject} never achieved.
  newdfguide3: Consumed in life by ambition that led to murder and exile, {CAT/main} now recruits  like-minded souls to bolster the Dark Forest's ranks.
  newdfguide4: {CAT/main} fell to darkness after a devastating loss. Now {PRONOUN/main/subject} {CONJU/main/guide/guides} others who have lost their way to the Dark Forest.
  # TODO which ancient group of cats?
  newscguide1: {CAT/main} was originally from an ancient group of cats but decided to watch and protect the newly formed {CLAN/main}Clan.
  newscguide2: Known for {PRONOUN/main/poss} unwavering fairness in life, {CAT/main} now guides others to StarClan, ensuring each spirit finds its rightful place.
  newscguide3: Having sacrificed {PRONOUN/main/poss} life to save {PRONOUN/main/poss} family, {CAT/main} now guides worthy cats to StarClan.
  newscguide4: A peacemaker in life, {CAT/main} now unites spirits from the new Clans in StarClan.
  newscguide5: A healer in life, {CAT/main} now protects the Clans from StarClan.
  exstarclan1: {CAT/main} snuck into StarClan when {PRONOUN/main/subject} died, but was discovered and exiled back to the Dark Forest after many years.
  exstarclan2: {CAT/main} was originally from StarClan, but after getting lost in the Dark Forest one day, {PRONOUN/main/subject} {CONJU/main/were/was} unable to find {PRONOUN/main/poss} way back. Now, {PRONOUN/main/subject} belong to the Place of No Stars, resenting {PRONOUN/main/poss} StarClan family who never came to find {PRONOUN/main/object}.
  exstarclan3: {CAT/main} belonged to StarClan once, but got lost outside of StarClan territory one day and has been bitterly wandering the Dark Forest ever since.
  otherclan10: {CAT/main} was originally a member of {CLAN/other}Clan, but left because {PRONOUN/main/subject} couldn't stand the tragic loss of a loved one.
  otherclan11: When {CAT/main} became lost and tried to find {PRONOUN/main/poss} former Clan, {CAT/second} joined {PRONOUN/main/object} on {PRONOUN/main/poss} journey. However, the two arrived too late and ultimately decided to make {CLAN/main}Clan their new home.
  otherclan12: {CAT/main} caused a tragedy in {PRONOUN/main/poss} original Clan, and fled to avoid facing the consequences from {PRONOUN/main/poss} former Clanmates.
  otherclan13: {CAT/main} left {PRONOUN/main/poss} former Clan to be with {PRONOUN/main/poss} lover, but {PRONOUN/main/poss} leader refused and chased {PRONOUN/main/object} out of the territory and into {CLAN/main}Clan's, where they were offered sanctuary.
  otherclan5: {CAT/main} never really fit in with {PRONOUN/main/poss} original Clan, always feeling out of place. {PRONOUN/main/subject/CAP} found solace and purpose in this new Clan.
  otherclan6: The rules and rigidity of {PRONOUN/main/poss} previous Clan stifled {CAT/main}. {PRONOUN/main/subject/CAP} sought a place where {PRONOUN/main/subject} could truly be {PRONOUN/main/self}.
  otherclan7: {CAT/main} decided to leave {PRONOUN/main/poss} previous Clan for completely normal, innocent reasons... Totally not because {PRONOUN/main/subject} {CONJU/main/have/has} a crush on someone in {CLAN/main}Clan, or anything.
  # TODO can I use {CLAN/other/emo.neg} like this?
  otherclan8: {CAT/main} was sent by the leader of {CLAN/other/emo.neg}Clan to gather secrets and intel on {CLAN/main}Clan.
  otherclan9: {CAT/main} was stolen from a rival Clan as a kit due to underpopulation.
  outsider4: {CAT/main} joined {CLAN/main}Clan after {PRONOUN/main/poss} need to wander died out.
  outsider5: {CAT/main} joined {CLAN/main}Clan in hopes of a new adventure.
  outsider6: {CAT/main} visited {CLAN/main}Clan almost every single day despite living outside the Clan. {PRONOUN/main/subject/CAP} finally decided to join one day, since {PRONOUN/main/subject} already spent so much time at the Clan.
