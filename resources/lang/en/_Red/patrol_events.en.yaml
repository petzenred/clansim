filter:
  cats:
    main:
      OR:
        rank:
          - warrior
          - deputy
          - leader
    app:
      AND:
        rank:
          - apprentice
        main_clan: true
        rel: apprentice
prompt:
  text: "One of {CAT/main}'s favourite methods to mentor {CAT/main/apprentice} is to ask a question 
  {PRONOUN/main/subject} {VERB/want/wants} a specific answer to, but to wait until the next sunrise to get 
  {CAT/main/apprentice}'s answer. Today, as the two cats head back to camp after a long day of training, {CAT/main} 
  poses the question: why do we follow the warrior code?"
  art: x.pngs
do_not_proceed:
  text: "The dawn patrol the next morning find the scent trail of a {CLAN/other_clan} warrior deep in 
  {CLAN/main}'s territory. In all the buzz about the border violation, {CAT/main} forgets to ask {CAT/main/apprentice} 
  for the answer to their question."
  art: x.pngs
proceed_1_1:
  text: "The next day, as they head out on a hunting trip, {CAT/app} confidently tells {CAT/main},"
  filter:
    cats:
      app:
        OR:
          personality:
            -
proceed_1_2:
  text: "The next day, {CAT/app} hesitantly tells {CAT/main},"
  filter:
    cats:
      app:
        OR:
          personality:
            -
proceed_1_3:
  text: "After a night spent deep in thought, {CAT/app} has come up with an answer."
  filter:
    cats:
      app:
        OR:
          personality: ~
proceed_2_1:
  text: "We follow the warrior code because we are warrior cats of the Clans. If we didn't, we would be no better than loners and rogues."
  filter:
    cats:
      app:
        OR:
          personality: ~
art:
  prompt: x.png
  do_not_proceed: x.png
  fail: x.png
  succeed: x.png



app_traits_1:
  - confident