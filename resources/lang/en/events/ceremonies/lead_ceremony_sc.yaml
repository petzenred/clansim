# idea: LIFE: an ancient cat who shares a trait with m_c
# idea: LIFE: an ancient cat who has a high stat in a facet that m_c has a low stat in (has a trait m_c lacks)
# idea: LIFE: m_c's mentor
# idea: LIFE: a cat who died on a patrol m_c was leading
# idea: LIFE: a dead mate of m_c
# idea: LIFE: leader's Clan founder

# TAGS: new_clan, unknown_blessing

intro:
  default: # default
    filter:
      tags: []
      leader:
        trait: ~
    text: "m_c leaves to speak with StarClan. {PRONOUN/m_c/subject/CAP} {VERB/m_c/close/closes} {PRONOUN/m_c/poss} eyes and {VERB/m_c/are/is} immediately surrounded by {PRONOUN/m_c/poss} loved ones, friends, and Clanmates who have passed on. Stars shine throughout their pelts, and their eyes are warm as they greet the new leader."
  new_clan: # new_clan
    filter:
      tags:
        - new_clan
      leader:
        trait: ~
    text: "As m_c dreams that night, {PRONOUN/m_c/subject} {VERB/m_c/find/finds} {PRONOUN/m_c/self} walking the stars of Silverpelt, a ghostly landscape surrounding {PRONOUN/m_c/object} and a single, starry cat sat within a clearing."
  0: # violent leader
    filter:
      tags: []
      leader:
        trait:
          OR:
            - bloodthirsty
            - vengeful
    text: "m_c leaves to speak with StarClan. {PRONOUN/m_c/subject/CAP} {VERB/m_c/close/closes} {PRONOUN/m_c/poss} eyes and {VERB/m_c/awaken/awakens} under a vast, inky black sky. {PRONOUN/m_c/subject/CAP} {VERB/m_c/turn/turns} around to see a wary group of cats approaching, stars dotting their fur."
lives:
  #example:
  #  filter:
