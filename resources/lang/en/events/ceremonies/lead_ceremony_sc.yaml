      - bravery
      - certainty
      - clear judgment
      - confidence
      - courage
      - determination
      - endurance
      - farsightedness
      - friendship
      - loyalty
      - mercy
      - strength
      - sympathy
      - trust
      - unity
  7: # Warrior, deputy, or leader who the leader knew
    filter:
      tags: []
      leader:
        trait: ~
      giver:
        trait: ~
        rank:
          OR:
            - warrior
            - deputy
            - leader
        lead_rel:
            op: morethan
            value: 0 # Filter out cats who didn't have a positive relationship with the leader.
    text: "r_c steps forward to give m_c a life for [virtue]. m_c grits {PRONOUN/m_c/poss} teeth as the chill of their new life rushes into {PRONOUN/m_c/object}, pouring over their soul like ice water."
    virtues:
      - acceptance
      - bravery
      - certainty
      - clear judgment
      - confidence
      - courage
      - determination
      - endurance
      - farsightedness
      - strength
      - unity
  8: # Warrior, deputy, or leader who the leader knew
    filter:
      tags: []
      leader:
        trait: ~
      giver:
        trait: ~
        rank:
          OR:
            - warrior
            - deputy
            - leader
        lead_rel:
            op: morethan
            value: 0 # Filter out cats who didn't have a positive relationship with the leader.
    text: "r_c dips {PRONOUN/r_c/poss} head in greeting. m_c is caught of guard when r_c's gifted life for [virtue] surges through m_c's pelt like lightning, making all of {PRONOUN/m_c/poss} fur stand on end."
    virtues:
      - acceptance
      - bravery
      - courage
      - determination
      - empathy
      - endurance
      - friendship
      - loyalty
      - trust
  9:
    filter:
      tags: []
      leader:
        trait:
          OR:
            - ambitious
      giver:
        trait: ~
        rank: ~
        lead_rel: ~
    text: "With a calm meow that m_c should keep {PRONOUN/m_c/poss} ambitions in check and not lose {PRONOUN/m_c/self} to greed, r_c delivers a life for [virtue]."
    virtues:
      - acceptance
      - clear judgment
      - confidence
      - empathy
      - farsightedness
      - friendship
      - humility
      - mercy
      - selflessness
      - sympathy
      - trust
      - unity
outro:
  default:
    filter:
      tags: []
      leader:
        trait: ~
    text: "r_c hails m_c by {PRONOUN/m_c/poss} new name, m_c_star, telling {PRONOUN/m_c/object} that {PRONOUN/m_c/poss} old life is no more. {PRONOUN/m_c/subject/CAP} {VERB/m_c/are/is} granted guardianship of c_n, and {VERB/m_c/are/is} told to use {PRONOUN/m_c/poss} new power wisely. The group of starry cats yowls m_c_star's name in support. m_c_star wakes up feeling a new strength within {PRONOUN/m_c/poss} body and knows that {PRONOUN/m_c/subject} {VERB/m_c/are/is} now ready to lead the Clan."
  new_clan:
    filter:
      tags:
        - new_clan
      leader:
        trait: ~
    text: "m_c_star wakes, {PRONOUN/m_c/poss} new name echoing in {PRONOUN/m_c/poss} ears."
  0: # violent leader
    filter:
      tags: []
      leader:
        trait:
          OR:
            - bloodthirsty
            - vengeful
    text: "r_c hails m_c by {PRONOUN/m_c/poss} new name, m_c_star, telling {PRONOUN/m_c/object} that {PRONOUN/m_c/poss} old life is no more. {PRONOUN/m_c/subject/CAP} {VERB/m_c/are/is} granted guardianship of c_n, and {VERB/m_c/are/is} told to use {PRONOUN/m_c/poss} new power wisely. StarClan is silent as the new leader begins to wake up. m_c_star stands, feeling a new strength within {PRONOUN/m_c/poss} body, and grins."


