# skills.en.yaml - Text strings for the skills a cat can have.

# skill levels: novice, apprentice, adept, master

#  example_skill:
#    kit: ~ # no matter what the skill XP is, when the cat is a kit this text is used
#    1: ~ # Python reads the wiggle as None
#    2: ~
#    3: ~
#    4: ~

# ---- Supernatural skills ---- #
# skill: StarClan
starclan:
  kit: stargazer
  1: has strange dreams
  2: spiritual
  3: connected to StarClan
  4: StarClan-chosen

# skill: DarkForest # DARK
dark_forest:
  kit: ~ # Kits can't have this skill because the DF picks cats who are already angry about something
  1: restless sleeper
  2: has visions of dark cats
  3: visits places no other cat dares to tread
  4: will never see StarClan

# skill: Clairvoyance
future:
  kit: had a dream about something that happened yesterday... last week
  1: oddly insightful
  2: knows what will happen today
  3: often has visions
  4: prophet

# skill:
ghost:
  kit: sometimes talks to the empty air
  1: morbidly curious
  2: swears {PRONOUN/main} {VERB/have/has} seen a ghost
  3: believes in the paranormal
  4: speaks with spirits # sees dead people

# ---- Rank skills ---- #
# skill: Teaching
teach:
  kit: asks questions when the other kits are too embarrassed to
  1: quick to help
  2: has a way with apprentices
  3: effective teacher
  4: beloved mentor

# skill: CampKeeping # CAMP
camp:
  kit: brags that the apprentices 'let' them change the nursery bedding
  1: picky nest builder
  2: steady paws
  3: camp keeper
  4: builds the steadiest dens in the Clan

# skill: Fighting
fight:
  kit: avid play-fighter
  1: prefers battle training to hunting
  2: just learned a cool new battle move
  3: not someone to mess with
  4: LionClan warrior


# skill: Herbalism
herb:
  kit: can list all their favorite flowers
  1: interested in herbs
  2: studying herbs
  3: accomplished herbalist
  4: has sworn to lend a paw to any cat in pain

# skill: Interpretation
interpret:
  kit: their favourite word is "why"
  1: interested in oddities
  2: keeps an eye out for omens
  3: finds meaning in dreams
  4: prophecy interpreter

# skill: Mediation
mediate:
  kit: cries whenever cats argue
  1: quick to make peace
  2: can get along with anyone
  3: always finds common ground
  4: renowned mediator

# skill: KitSitting
queen:
  kit: active imagination
  1: loves the idea of being a parent
  2: great with kits
  3: everykit's favorite cat
  4: beloved kit-sitter

# skill: Comforting
comfort:
  kit: hates it when the other kits cry
  1: gentle voice
  2: comforting presence
  3: nightmare soother
  4: den-{PRONOUN/main/parent}

# ---- Hunting skills ---- #

# skill: Fishing
fish:
  kit: bats at puddles
  1: minnow-catcher
  2: trout-catcher
  3: pike-catcher
  4: could catch a reflection

# skill: Stalking
stalk:
  kit: moss ball hunter
  1: working on staying balanced when crouching
  2: keen-eared
  3: is the bane of - uh - mice
  4: melts into the shadows

# skill: Ambushing
ambush:
  kit: can jump super-duper high
  1: flushes out birds for the other hunters
  2: patient
  3: ~
  4: ~

# skill: Scavenging
scavenge:
  kit: \"No, {CAT/main}, don't dig that up!\"
  1: doesn't mind how fresh their fresh-kill is
  2: knows what a 'dumpster' is
  3: has a good nose for garbage
  4: knows where the Twolegs leave all the best trash

# ---- Movement skills ---- #
# skill: Running
run:
  kit: frantically energetic
  1: natural sprinter
  2: good at managing {PRONOUN/main/poss} stamina
  3: endurance runner
  4: could have been named Runningwind

# skill: Climbing
climb:
  kit: loves to watch flying birds
  1: learning the climbing ropes
  2: great at tree-climbing
  3: impressive climber
  4: can get up a sheer cliff

# skill: Swimming
swim:
  kit: loves to jump in puddles
  1: just getting their paws wet
  2: kitty-paddler
  3: powerful swimmer
  4: swims like a fish

# skill: Navigating
navigate:
  kit: the best hide-and-seek player in the Clan
  1: developing a sense of direction
  2: knows the territory's nooks and crannies
  3: never gets lost
  4: masterful navigator

# ---- Social skills ---- #
# skill: Speaking
speech:
  kit: has a squeaky voice, even for a kit
  1: appreciates eloquence
  2: quick with a joke
  3: always knows the right thing to say
  4: silver-tongued

# skill: Reasoning
reason:
  kit: {CLAN/main/queen} is convinced that {CAT/main} is the kits' ringleader, but can't prove it
  1: thoughtful
  2: quick-witted
  3: the smartest cat in the room # cleverer than you
  4: grey eminence # CK3 reference

# skill: Advising
advice:
  kit: actually takes the elders' advice
  1: good listener
  2: helpful insight
  3: valuable insight
  4: trusted advisor

# skill: Observation
observe:
  kit: has a slightly creepy stare
  1: good natural intuition
  2: oddly observant
  3: eyes like a hawk's
  4: unnatural senses

# skill: Storytelling
story:
  kit: got in trouble once for waking a sleeping elder to beg to hear about LionClan... again
  1: always asking for a story
  2: tells tall tales
  3: weaves colourful words
  4: masterful storyteller

# skill: History # LORE
history:
  kit: always wants to be {CLAN/main/leader} when the kits play make-believe
  1: interested by Clan history
  2: always talking about the dawn of the Clans
  3: perfect memory
  4: master historian
