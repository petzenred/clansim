        - (4, 5)
      base_adult_timeskip_xp: # base_adult_timeskip_ex
        - (4, 12)
        - (6, 7)
      base_senior_timeskip_xp: # base_senior_timeskip_ex
        - (3, 9)
        - (3, 4)
  focus:
    min_duration_moons: 3 # duration
    # Defines how much a working warrior(leader/deputy) or apprentice gathers additionally.
    hunting:
        warrior: 2
        apprentice: 1
    # Defines how much increase or decrease the reputation is.
    outsiders:
      reputation: 5,
    # Defines how much increase or decrease the relation with other Clan is.
    other clans:
      relation: 2
    raid other clans:
      # how much prey each working warrior(leader/deputy) will gather
      prey_warrior: 3
      # how much herb each working medicine cat will gather
      herb_medicine: 4
      # chance of each warrior(leader/deputy) or medicine cat to get injured,
      injury_chance_warrior: 18
      injury_chance_medicine cat: 33
      # the more clan which are raided the more likely it is to get injured
      chance_increase_per_clan: 3
      # list of injuries which can occur and to which distribution
      #   current sum of injuries is 100 - for easier understanding it should stay the same
      injuries:
          claw-wound: 15
          cat bite: 15
          torn pelt: 15
          torn ear: 15
          bite-wound: 10
          sprain: 10
          bruises: 7
          sore: 6
          small cut: 4
          cracked pads: 3
      # amount of decrease; Clan relation is between 0 and 30, therefore a smaller number is chosen,
      relation: 3
    # ! raiding other clans should be more dangerous than hoarding !
    hoarding:
      # how much prey each working warrior(leader/deputy) will gather
      prey_warrior: 1
      # how much herb each working medicine cat will gather
      herb_medicine: 2
      # injury chance of each warrior(leader/deputy) or medicine cat to get injured,
      injury_chance_warrior: 25
      injury_chance_medicine cat: 35
      # list of injuries which can occur and to which distribution
      injuries:
        cracked pads: 15
        sore: 15
        bruises: 15
        sprain: 12
        small cut: 10
        torn pelt: 10
        torn ear: 10
        claw-wound: 5
        bite-wound: 5
        cat bite: 3
      # a cat can get EITHER injured OR sick, not both - for simpler distribution
      #  (50/50 chance decide which condition will be used)
      # chance of each warrior(leader/deputy) and medicine cat to get sick
      illness_chance: 35
      # list of illnesses which can occur and to which distribution
      #   current sum of injuries is 100 - for easier understanding it should stay the same
      illnesses:
        running nose: 5
        whitecough: 1
    rest and recover:
      # injury will be roughly prevented for every fourth cat
      injury_prevent: 4
      # illness will be roughly prevented for every sixth cat - illness is not as easy preventable as injuries
      illness_prevent: 6
      # every second outbreak will be prevented
      outbreak_prevention: 2
      # the moon amount where the cats are earlier healed
      moons_earlier_healed: 1
  save_load:
    load_integrity_checks: true
  sorting:
    # true = sort dead cats by total age (in the order they were born)
    # false = sort dead cats by their age at the time of death
    sort_dead_by_total_age: true
    # true = when filtering dead cats by rank, list them in the order they died
    # false = when filtering dead cats by rank, sort dead cats by total age (in the order they were born)
    sort_rank_by_death: true
    # true = sort a cat's relationships by the sum of their values
    # false = sort a cat's relationships in the order they were added
    sort_by_rel_total: true
