# _game_config.py - Combined the original `_game_config.json`, `prey_config.json`, and `screen_config.json` in order to reduce load times by removing I/O operations.

GAME_CONFIG:
  relationship:
    # VALUES IN RELATIONSHIP DICT
    #   0: no condition
    #   positive number: value has to be higher than number
    #   negative number: value has to be lower than number
    in_decrease_value:
      low: 8
      medium: 12
      high: 16
      max_interaction: 5
      max_interaction_special: 8
      compatibility_effect: 5
      passive_influence_div: 1.5
      # 1/10 to make the interaction of the relationship to a 'neutral' instead of negative or positive
      chance_for_neutral: 10
      # 1/8 often when a group event is happening not all cats are considered, only a special group, which is
      #  defined in group_types.json
      chance_of_special_group: 8
      # 1/8 chance of a romantic interaction between cat_1 and cat_2 if cat_1 is mates with cat_3
      chance_romantic_not_mate: 15
      # how much an event with a condition can influence the relationship
      influence_condition_events: 20m
    mates:
      age_range: 40
      override_same_age_group: False
      # 1/5 of becoming mates when the conditions are fulfilled
      chance_fulfilled_condition: 5
      # 1/170 of becoming mates after the trigger `friends_to_lover` 
      #   has to be a high number because many relationships are checked each moon
      chance_friends_to_lovers: 170
      confession:
        # if one cat has these feelings for another, they confess
        #   if they have feelings for more than one cat, they'll choose their strongest crush
        make_confession:
          romantic: 30
          platonic: 15
          dislike: -15
          admiration: 0
          comfortable: 10
          jealousy: 0
          trust: 0
        # if these conditions are fulfilled by the opposite cat, they accept, otherwise, they reject
        accept_confession:
          romantic: 17
          platonic: 15
          dislike: -10
          admiration: 0
          comfortable: 10
          jealousy: 0
          trust: 0
      # both relationships have to fulfill this condition
      mate_condition: 
          romantic: 20
          platonic: 30
          dislike: -10
          admiration: 0
          comfortable: 20
          jealousy: 0
          trust: 0
      # TODO
      platonic_to_romantic: 
        romantic: 0
        platonic: 30
        dislike: -15
        admiration: 0
        comfortable: 20
        jealousy: 0
        trust: 0
      poly:
        # which conditions all current mate relationships has to have towards the main cat + vise versa
        current_mate_condition:
          romantic: 30
          platonic: 0
          dislike: 0
          admiration: 0
          comfortable: 15
          jealousy: -15
          trust: 25
          # which conditions all current mate relationships has to have towards the new possible mate + vise versa
        mates_to_each_other:
          romantic: 0
          platonic: 15
          dislike: -10
          admiration: 0
          comfortable: 15
          jealousy: -15
          trust: 20
  new_cat:
    parent_buff:
      kit_to_parent:
        romantic: 0
        platonic: 40
        dislike: 0
        admiration: 30
        comfortable: 40
        jealousy: 0
        trust: 50
      parent_to_kit:
        romantic: 0
        platonic: 40
        dislike: 0
        admiration: 30
        comfortable: 40
        jealousy: 0
        trust: 30
    sib_buff:
      cat1_to_cat2:
        romantic: 0
        platonic: 40
        dislike: 0
        admiration: 10
        comfortable: 40
        jealousy: 0
        trust: 30
